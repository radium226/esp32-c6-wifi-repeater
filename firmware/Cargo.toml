[package]
edition      = "2024"
name         = "wifi-repeater"
rust-version = "1.95"
version      = "0.1.0"
license      = "Beerware"
# The other files in src/bin are modules of main.rs, not binaries.
autobins     = false

[[bin]]
name = "wifi-repeater"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32c6", "log-04", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c6",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c6", "log-04"] }
log                    = "0.4.27"

esp-alloc = { version = "0.11.0", features = ["esp32c6"] }
esp-backtrace = { version = "0.20.0", features = [
  "esp32c6",
  "panic-handler",
  "println",
] }
esp-storage = { version = "0.10.0", features = ["esp32c6"] }
esp-println = { version = "0.18.0", features = ["esp32c6", "log-04"] }
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
esp-radio = { version = "1.0.0-beta.1", features = [
  "esp-alloc",
  "esp32c6",
  "log-04",
  "unstable",
  "wifi",
] }

bridge-core        = { path = "../bridge-core" }
critical-section   = "1.2.0"
embassy-futures    = "0.1.2"
embassy-net-driver = "0.2.0"
embassy-sync       = "0.8.0"
static_cell        = "2.1.1"
embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "auto-icmp-echo-reply",
  "dhcpv4-hostname",
  "log",
  "medium-ethernet",
  "multicast",
  "proto-ipv4",
  "tcp",
  "udp",
] }
embedded-io-async = "0.7.0"
heapless          = "0.9"


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
